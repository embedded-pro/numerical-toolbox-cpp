name: Build Booklet

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - "scripts/build-booklet.py"
      - "scripts/booklet/**"
      - ".github/workflows/build-booklet.yml"
  pull_request:
    paths:
      - "doc/**"
      - "scripts/build-booklet.py"
      - "scripts/booklet/**"
      - ".github/workflows/build-booklet.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: booklet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Pandoc and the XeLaTeX tool chain come with the container image.
    container: gabrielfrasantos/embedded-devcontainer-documentation:v7.4.0@sha256:0537b16931e116f98fd62e0bad454af5bcd102ec6501ccdef2b270aa83fd281e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The checkout belongs to the runner user, while the container runs as root.
      - name: Mark the workspace as a safe Git directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build booklet (PDF + HTML)
        run: python3 scripts/build-booklet.py --format all

      - name: Upload PDF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: numerical-toolbox-booklet
          path: build/booklet/NumericalToolbox.pdf

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/booklet

      - name: Attach PDF to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/booklet/NumericalToolbox.pdf

  deploy-pages:
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
